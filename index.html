<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Apple HD Player</title>
    <style>
        body {
            background-color: #020205; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            -webkit-font-smoothing: antialiased; 
            color: #d4ffff;
            font-family: sans-serif;
            user-select: none; 
            transition: all 0.3s ease;
        }

        #ascii-screen {
            font-family: 'Courier New', Courier, monospace;
            font-size: 5px;       
            line-height: 5px;     
            letter-spacing: 0px;  
            white-space: pre; 
            margin-bottom: 20px;
            text-shadow: 0 0 2px #fff, 0 0 5px #00ffff, 0 0 10px #00ffff, 0 0 20px #00ffff;
            transition: all 0.3s ease;
            transform-origin: center;
            transform: scale(1.0); 
        }

        #controls-container {
            display: flex;
            align-items: center;
            gap: 15px;
            background-color: rgba(0, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #00ffff;
            box-shadow: 0 0 10px #00ffff;
            transition: all 0.3s ease;
        }

        button {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            background-color: #00ffff;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            box-shadow: 0 0 10px #00ffff;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: white;
            box-shadow: 0 0 20px #ffffff;
        }

        .ascii-slider {
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            cursor: pointer;
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            touch-action: none; 
        }

        #time-display {
            font-size: 14px;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 5px #00ffff;
            width: 90px;
            text-align: center;
            transition: all 0.3s ease;
        }

        #loading {
            color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
            margin-bottom: 10px;
        }

        #donate-btn {
            position: fixed; 
            top: 20px;       
            right: 20px;     
            padding: 10px 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none; 
            color: #ff00ff; 
            border: 1px solid #ff00ff;
            border-radius: 5px;
            box-shadow: 0 0 10px #ff00ff; 
            background-color: rgba(255, 0, 255, 0.1);
            transition: all 0.3s ease;
            z-index: 1000; 
        }

        #donate-btn:hover {
            background-color: #ff00ff;
            color: white;
            box-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff;
        }

        body.classic-mode { background-color: black; color: white; }
        body.classic-mode #ascii-screen { color: #ddd; text-shadow: none; }
        body.classic-mode #controls-container { background-color: transparent; border: 1px solid white; box-shadow: none; }
        body.classic-mode button { background-color: white; color: black; box-shadow: none; }
        body.classic-mode .ascii-slider, body.classic-mode #time-display, body.classic-mode #loading { color: white; text-shadow: none; }
        body.classic-mode #donate-btn { color: white; border-color: white; background-color: transparent; box-shadow: none; }
        body.classic-mode #donate-btn:hover { background-color: white; color: black; }

        @keyframes rainbowGlow {
            0%   { color: #ff0000; text-shadow: 0 0 5px #ff0000, 0 0 15px #ff0000; }
            15%  { color: #ff7f00; text-shadow: 0 0 5px #ff7f00, 0 0 15px #ff7f00; }
            30%  { color: #ffff00; text-shadow: 0 0 5px #ffff00, 0 0 15px #ffff00; }
            45%  { color: #00ff00; text-shadow: 0 0 5px #00ff00, 0 0 15px #00ff00; }
            60%  { color: #0000ff; text-shadow: 0 0 5px #0000ff, 0 0 15px #0000ff; }
            75%  { color: #4b0082; text-shadow: 0 0 5px #4b0082, 0 0 15px #4b0082; }
            90%  { color: #9400d3; text-shadow: 0 0 5px #9400d3, 0 0 15px #9400d3; }
            100% { color: #ff0000; text-shadow: 0 0 5px #ff0000, 0 0 15px #ff0000; }
        }

        body.rainbow-mode #ascii-screen, body.rainbow-mode #time-display, body.rainbow-mode .ascii-slider, body.rainbow-mode #loading, body.rainbow-mode #donate-btn, body.rainbow-mode button {
            animation: rainbowGlow 2s linear infinite !important; 
        }
        body.rainbow-mode #controls-container, body.rainbow-mode button, body.rainbow-mode #donate-btn {
            background-color: transparent !important; 
        }
    </style>
</head>
<body class="classic-mode">

    <a href="https://paypal.me/@hyunjunseo129" target="_blank" id="donate-btn">☕ Support Developer</a>

    <div id="loading">HD 데이터를 불러오는 중입니다...</div>
    <div id="ascii-screen"></div>

    <div id="controls-container">
        <button id="play-btn" disabled>▶ PLAY</button>
        <span id="ascii-progress" class="ascii-slider">[                                        ]</span>
        <span id="time-display">0:00 / 0:00</span>
        <span>VOL</span>
        <span id="ascii-volume" class="ascii-slider">[               ]</span>
        <button id="neon-btn">NEON: OFF</button>
    </div>

    <script>
        const screen = document.getElementById('ascii-screen');
        const playBtn = document.getElementById('play-btn');
        const neonBtn = document.getElementById('neon-btn');
        const loadingText = document.getElementById('loading');
        const asciiProgress = document.getElementById('ascii-progress');
        const asciiVolume = document.getElementById('ascii-volume');
        const timeDisplay = document.getElementById('time-display');
        
        const audio = new Audio('bad_apple.mp3'); 
        
        let frames = [];
        let isPlaying = false;
        let isNeon = false; 
        let intervalId;
        
        const fps = 15; 
        const progressLen = 40; 
        const volumeLen = 15;   

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec.toString().padStart(2, '0')}`;
        }

        function generateSmoothAsciiBar(percent, length) {
            const fractions = [' ', '▏', '▎', '▍', '▌', '▋', '▊', '▉'];
            const fullChar = '█';
            const emptyChar = ' '; 

            const fillAmount = percent * length;
            const fullBlocks = Math.floor(fillAmount);
            
            if (fullBlocks >= length) return '[' + fullChar.repeat(length) + ']';

            const fractionIndex = Math.floor((fillAmount - fullBlocks) * fractions.length);
            const fullStr = fullChar.repeat(fullBlocks);
            const fracStr = fractions[fractionIndex];
            const emptyStr = emptyChar.repeat(Math.max(0, length - fullBlocks - 1));

            return '[' + fullStr + fracStr + emptyStr + ']';
        }

        fetch('bad_apple_data.json')
            .then(response => response.json())
            .then(data => {
                frames = data;
                loadingText.style.display = 'none';
                screen.textContent = ">>> HD SYSTEM READY <<<\nPRESS START BUTTON";
                playBtn.disabled = false;
            })
            .catch(error => console.error("Error loading JSON:", error));

        function renderFrame() {
            let currentFrame = Math.floor(audio.currentTime * fps);
            if (currentFrame < frames.length) {
                screen.textContent = frames[currentFrame];
            } else {
                stopPlaying();
            }
        }

        function startPlaying() {
            isPlaying = true;
            playBtn.textContent = '⏸ PAUSE';
            audio.play();
            intervalId = setInterval(renderFrame, 1000 / fps);
        }

        function stopPlaying() {
            isPlaying = false;
            playBtn.textContent = '▶ PLAY';
            audio.pause();
            clearInterval(intervalId);
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) stopPlaying();
            else startPlaying();
        });

        neonBtn.addEventListener('click', () => {
            isNeon = !isNeon;
            if (isNeon) {
                document.body.classList.remove('classic-mode');
                neonBtn.textContent = 'NEON: ON';
            } else {
                document.body.classList.add('classic-mode');
                neonBtn.textContent = 'NEON: OFF';
            }
        });

        function updateProgress() {
            if (!audio.duration) return;
            const percent = audio.currentTime / audio.duration;
            asciiProgress.textContent = generateSmoothAsciiBar(percent, progressLen);
            timeDisplay.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
        }

        function updateVolume() {
            asciiVolume.textContent = generateSmoothAsciiBar(audio.volume, volumeLen);
        }

        updateVolume();

        function animateUI() {
            if (isPlaying || isDraggingProgress) {
                updateProgress();
            }
            requestAnimationFrame(animateUI);
        }
        requestAnimationFrame(animateUI);

        // ==========================================
        // 🌟 싱크 교정 핵심 기술: 괄호 [ ] 너비를 제외하고 정확도 계산 🌟
        // ==========================================
        function getAccuratePercent(e, element, innerLength) {
            const rect = element.getBoundingClientRect();
            const totalChars = innerLength + 2; // 전체 길이 = 막대기 + 양쪽 괄호 2개
            const charWidth = rect.width / totalChars; // 글자 1칸당 픽셀 크기
            
            // 왼쪽 괄호 '[' 공간을 건너뛴 진짜 막대기의 시작점 계산
            const startX = rect.left + charWidth; 
            const activeWidth = charWidth * innerLength; // 순수 막대기의 너비
            
            let percent = (e.clientX - startX) / activeWidth;
            return Math.max(0, Math.min(1, percent)); // 0과 1 사이로 강제 고정
        }

        // --- 실시간 드래그(Scrubbing) 로직 ---
        let isDraggingProgress = false;
        let wasPlayingBeforeDrag = false;

        function setProgressFromPointer(e) {
            if (!audio.duration) return;
            // 이제 새로 만든 고정밀 퍼센트 계산 함수를 사용합니다!
            const percent = getAccuratePercent(e, asciiProgress, progressLen); 
            
            audio.currentTime = percent * audio.duration;
            renderFrame(); 
            updateProgress(); 
        }

        asciiProgress.addEventListener('pointerdown', (e) => {
            isDraggingProgress = true;
            asciiProgress.setPointerCapture(e.pointerId); 
            wasPlayingBeforeDrag = isPlaying;
            if (isPlaying) stopPlaying(); 
            setProgressFromPointer(e);
        });

        asciiProgress.addEventListener('pointermove', (e) => {
            if (isDraggingProgress) {
                setProgressFromPointer(e);
            }
        });

        asciiProgress.addEventListener('pointerup', (e) => {
            if (isDraggingProgress) {
                isDraggingProgress = false;
                asciiProgress.releasePointerCapture(e.pointerId);
                if (wasPlayingBeforeDrag) startPlaying(); 
            }
        });

        let isDraggingVolume = false;

        function setVolumeFromPointer(e) {
            const percent = getAccuratePercent(e, asciiVolume, volumeLen);
            audio.volume = percent;
            updateVolume();
        }

        asciiVolume.addEventListener('pointerdown', (e) => {
            isDraggingVolume = true;
            asciiVolume.setPointerCapture(e.pointerId);
            setVolumeFromPointer(e);
        });

        asciiVolume.addEventListener('pointermove', (e) => {
            if (isDraggingVolume) {
                setVolumeFromPointer(e);
            }
        });

        asciiVolume.addEventListener('pointerup', (e) => {
            if (isDraggingVolume) {
                isDraggingVolume = false;
                asciiVolume.releasePointerCapture(e.pointerId);
            }
        });

        // --- 이스터 에그 (레인보우 모드) ---
        let secretCode = "";
        const easterEgg = "rainbow";
        document.addEventListener('keydown', (e) => {
            secretCode += e.key.toLowerCase();
            if (secretCode.length > easterEgg.length) {
                secretCode = secretCode.slice(-easterEgg.length);
            }
            if (secretCode === easterEgg) {
                document.body.classList.toggle('rainbow-mode');
                secretCode = ""; 
            }
        });

    </script>
</body>
</html>
